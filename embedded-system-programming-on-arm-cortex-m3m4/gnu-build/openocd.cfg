# OpenOCD for the Nucleo-L476RG through its on-board ST-LINK — the same
# shape CubeIDE generates for this board. Run from the Makefile:
#   make openocd     (server: GDB on :3333, telnet on :4444)
#   make load        (GDB client: reset, load the ELF, run)
source [find interface/stlink-dap.cfg]
transport select "dapdirect_swd"

set WORKAREASIZE 0x18000
set CHIPNAME STM32L476RGTx
set BOARDNAME NUCLEO-L476RG
source [find target/stm32l4x.cfg]

reset_config srst_only srst_nogate connect_assert_srst
